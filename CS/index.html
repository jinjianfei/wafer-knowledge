<div class="top-bar">

    <div class="upload-btn" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span>📁 上传文件</span>
      <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFile(this.files[0])">

<div id="alertBanner" class="alert-banner">

<div id="dashboard" class="hidden">

    <label>寄售库:</label>
    <select id="filterWh" onchange="renderTable()"><option value="">全部</option></select>
    <label>ST工厂:</label>
    <select id="filterFactory" onchange="renderTable()"><option value="">全部</option></select>
    <label>尺寸:</label>
    <div class="toggle-group" id="sizeFilter">
      <button class="active" onclick="toggleSize('6寸')">6寸</button>
      <button class="active" onclick="toggleSize('8寸')">8寸</button>
      <button class="active" onclick="toggleSize('12寸')">12寸</button>
      <button class="active" onclick="toggleSize('未知')">未知</button>
    </div>
    <label>搜索:</label>
    <input type="text" id="filterSearch" placeholder="客户料号 / 内部料号 / 产品类型" oninput="renderTable()">
    <div class="toggle-group">
      <button id="btnExternal" class="active" onclick="setViewMode('external')">🌐 对外</button>
      <button id="btnInternal" onclick="setViewMode('internal')">🔒 对内</button>
    </div>
    <button id="toggleInternalBtn" onclick="toggleInternalPN()" style="background:#6c757d;">🔒 隐藏内部料号</button>
    <button onclick="exportExcel()">📥 导出 Excel</button>
  </div>
  <div class="table-wrap">
    <table id="resultTable">
      <thead>
        <tr>
          <th style="min-width:42px">寄售库</th>
          <th style="min-width:42px">ST工厂</th>
          <th style="min-width:78px">客户料号</th>
          <th style="min-width:62px">产品类型</th>
          <th class="th-internal" style="min-width:78px">内部料号</th>
          <th style="min-width:58px">单价(26H2)</th>
          <th style="min-width:72px">Amount</th>
          <th style="min-width:52px">Total pcs</th>
          <th style="min-width:50px">在途</th>
          <th style="min-width:50px">1-30days</th>
          <th style="min-width:50px">31-60days</th>
          <th style="min-width:50px">61-90days</th>
          <th style="min-width:55px">91-150days</th>
          <th style="min-width:55px">151-180days</th>
          <th style="min-width:50px">>180days</th>
          <th style="min-width:46px">Total</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div id="loading" class="loading hidden">
  <div class="spinner"></div>
  <p>正在分析数据...</p>
</div>

<div id="emptyState" class="empty-state">
  <div class="big-icon">📂</div>
  <p>请上传库存导出文件以开始分析</p>
</div>

const INTERNAL_TYPE_MAP = {
    "6BKP8028": "6-PRIME",

    "6BNP6009": "8-PW-HD",

    "6TNP9579": "6-Logic-Test-A",
    "6TPP1477": "6-Logic-Test-A",
    "6TPP9580": "6-Logic-Test-A"
};

let rawData = [];
let analyzedData = [];
let summaryRows = [];
let missingPartNumbers = new Set();
let showInternalPN = true;
let viewMode = 'external';
let selectedSizes = new Set(['6寸', '8寸', '12寸', '未知']);

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('btnExternal').classList.toggle('active', mode === 'external');
  document.getElementById('btnInternal').classList.toggle('active', mode === 'internal');
  if (analyzedData.length > 0) {
    missingPartNumbers.clear();
    for (const r of analyzedData) {
      r.productType = getProductType(r.customerPN);
    }
    if (missingPartNumbers.size > 0) {
      const list = Array.from(missingPartNumbers).slice(0, 10).join('、');
      const more = missingPartNumbers.size > 10 ? ' 等共' + missingPartNumbers.size + '条' : '';
      document.getElementById('alertText').textContent = 
        '以下客户料号未在映射表中找到对应产品类型，请联系管理员更新料号匹配表：' + list + more;
      document.getElementById('alertBanner').classList.add('show');
    } else {
      document.getElementById('alertBanner').classList.remove('show');
    }
    buildSummary();
    renderTable();
  }
}

function toggleSize(size) {
  const btn = document.querySelector(`#sizeFilter button[onclick="toggleSize('${size}')"]`);
  if (selectedSizes.has(size)) {
    selectedSizes.delete(size);
    btn.classList.remove('active');
  } else {
    selectedSizes.add(size);
    btn.classList.add('active');
  }
  renderTable();
}

document.getElementById('dropZone').addEventListener('dragover', e => {
  e.preventDefault();
});
document.getElementById('dropZone').addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file) return;
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('alertBanner').classList.remove('show');
  missingPartNumbers.clear();

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array', cellDates: true });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      rawData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false });
      processData();
    } catch (err) {
      alert('文件解析失败: ' + err.message);
      document.getElementById('loading').classList.add('hidden');
    }
  };
  reader.readAsArrayBuffer(file);
}

function getHeaderIndex(headers, keywords) {
  for (let i = 0; i < headers.length; i++) {
    const h = String(headers[i] || '').trim();
    for (const kw of keywords) {
      if (h.includes(kw)) return i;
    }
  }
  return -1;
}

function excelDateToJSDate(serial) {
  if (!serial) return null;
  if (serial instanceof Date) return serial;
  const n = Number(serial);
  if (isNaN(n)) {
    const d = new Date(serial);
    return isNaN(d.getTime()) ? null : d;
  }
  const epoch = new Date(1899, 11, 30);
  return new Date(epoch.getTime() + n * 86400000);
}

function extractPartNumber(customerPN) {
  let s = String(customerPN || '');
  if (s.toUpperCase().startsWith('0N')) {
    s = s.substring(2);
  }
  return s;
}

function getProductType(customerPN) {
  const pn = extractPartNumber(customerPN);
  if (viewMode === 'internal') {
    const internalType = INTERNAL_TYPE_MAP[pn];
    if (internalType) return internalType;
    missingPartNumbers.add(customerPN);
    return '';
  } else {
    const externalType = PART_MAP[pn];
    if (!externalType) {
      missingPartNumbers.add(customerPN);
      return '';
    }
    return externalType;
  }
}

function getSize(productType) {
  const pt = String(productType || '');
  if (viewMode === 'internal') {
    if (pt.startsWith('6-')) return '6寸';
    if (pt.startsWith('8-')) return '8寸';
    if (pt.startsWith('12-')) return '12寸';
  } else {
    if (pt.includes('D150')) return '6寸';
    if (pt.includes('D200')) return '8寸';
    if (pt.includes('D300')) return '12寸';
  }
  return '未知';
}

function processData() {
  if (rawData.length < 2) {
    alert('数据为空或格式不正确');
    document.getElementById('loading').classList.add('hidden');
    return;
  }

  const headers = rawData[0];

  let dataStartIndex = 1;
  const headerFirstCell = String(headers[0] || '').trim();
  while (dataStartIndex < rawData.length) {
    const row = rawData[dataStartIndex];
    if (!row || row.length === 0) {
      dataStartIndex++;
      continue;
    }
    const firstCell = String(row[0] || '').trim();
    if (firstCell === headerFirstCell || firstCell === '工厂' || firstCell === 'Factory') {
      dataStartIndex++;
    } else {
      break;
    }
  }

  const idx = {
    customer: getHeaderIndex(headers, ['客户']),
    material: getHeaderIndex(headers, ['物料']),
    qty: getHeaderIndex(headers, ['非限制使用的库存']),
    price: getHeaderIndex(headers, ['含税价']),
    shipDate: getHeaderIndex(headers, ['寄售补货发货时间']),
    useDate: getHeaderIndex(headers, ['领用日期']),
    customerPN: getHeaderIndex(headers, ['客户料号'])
  };

  const missing = Object.entries(idx).filter(([k,v]) => v === -1).map(([k]) => k);
  if (missing.length > 0) {
    alert('缺少必要列: ' + missing.join(', ') + '\n请检查表头名称');
    document.getElementById('loading').classList.add('hidden');
    return;
  }

  analyzedData = [];

  for (let i = dataStartIndex; i < rawData.length; i++) {
    const row = rawData[i];
    if (!row || row.length === 0) continue;

    const useDateVal = row[idx.useDate];
    if (useDateVal !== undefined && useDateVal !== null && String(useDateVal).trim() !== '') continue;

    const customer = parseInt(row[idx.customer]) || 0;
    const material = String(row[idx.material] || '');
    const qty = parseFloat(row[idx.qty]) || 0;
    const price = parseFloat(row[idx.price]) || 0;
    const shipDateVal = row[idx.shipDate];
    const customerPN = String(row[idx.customerPN] || '');

    let factory = 'Unknown';
    const matPrefix = material.substring(0, 8);
    if (matPrefix.includes('1200')) factory = 'AMK';
    else if (matPrefix.includes('4972')) factory = 'Catania';
    else if (matPrefix.includes('4970')) factory = 'Tours';
    else if (matPrefix.includes('4971')) factory = 'Rousset';
    else if (matPrefix.includes('2690')) factory = 'Agrate';
    else if (matPrefix.includes('9987')) factory = 'Crolles';
    else {
      if (material.toUpperCase().startsWith('L') || material.substring(0,2).toUpperCase().includes('L')) {
        if (customer === 12690) factory = 'Agrate';
        else if (customer === 19987) factory = 'Crolles';
      }
      if (factory === 'Unknown') {
        if (customer === 11200) factory = 'AMK';
        else if (customer === 12690) factory = 'Agrate';
        else if (customer === 19987) factory = 'Crolles';
      }
    }

    let wh = 'DSV';
    if (factory === 'AMK' && customer === 11200) wh = 'Evershine';
    else if (factory === 'Catania') wh = 'Femar';

    const shipDate = excelDateToJSDate(shipDateVal);
    let ageDays = null;
    if (shipDate) {
      ageDays = Math.floor((today - shipDate) / 86400000);
    }

    let ageBucket = 'Unknown';
    if (ageDays !== null) {
      const isTransit = (wh === 'Evershine' && ageDays <= 7) || (wh !== 'Evershine' && ageDays <= 14);
      if (isTransit) {
        ageBucket = 'inTransit';
      } else if (ageDays <= 30) {
        ageBucket = '1-30days';
      } else if (ageDays <= 60) {
        ageBucket = '31-60days';
      } else if (ageDays <= 90) {
        ageBucket = '61-90days';
      } else if (ageDays <= 150) {
        ageBucket = '91-150days';
      } else if (ageDays <= 180) {
        ageBucket = '151-180days';
      } else {
        ageBucket = '>180days';
      }
    }

    const productType = getProductType(customerPN);
    const size = getSize(productType);

    analyzedData.push({
      wh, factory, customerPN, productType,
      internalPN: material,
      size,
      price,
      qty,
      amount: qty * price,
      ageDays,
      ageBucket
    });
  }

  if (missingPartNumbers.size > 0) {
    const list = Array.from(missingPartNumbers).slice(0, 10).join('、');
    const more = missingPartNumbers.size > 10 ? ' 等共' + missingPartNumbers.size + '条' : '';
    document.getElementById('alertText').textContent = 
      '以下客户料号未在映射表中找到对应产品类型，请联系管理员更新料号匹配表：' + list + more;
    document.getElementById('alertBanner').classList.add('show');
  }

  buildSummary();
  updateFilters();
  renderTable();

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
}

function buildSummary() {
  const groups = {};
  for (const r of analyzedData) {
    const key = showInternalPN
      ? r.wh + '\x00' + r.factory + '\x00' + r.customerPN + '\x00' + r.internalPN
      : r.wh + '\x00' + r.factory + '\x00' + r.customerPN + '\x00' + r.productType;
    if (!groups[key]) {
      groups[key] = {
        wh: r.wh, factory: r.factory, customerPN: r.customerPN,
        productType: r.productType,
        internalPN: showInternalPN ? r.internalPN : '',
        size: r.size,
        price: 0,
        qty: 0, amount: 0,
        inTransit: 0,
        '1-30days': 0, '31-60days': 0, '61-90days': 0, '91-150days': 0, '151-180days': 0, '>180days': 0,
        ageDist: {
          'inTransit': {}, '1-30days': {}, '31-60days': {}, '61-90days': {}, '91-150days': {}, '151-180days': {}, '>180days': {}
        }
      };
    }
    groups[key].qty += r.qty;
    groups[key].amount += r.amount;
    if (groups[key][r.ageBucket] !== undefined) {
      groups[key][r.ageBucket] += r.qty;
    }
    if (r.ageDays !== null && groups[key].ageDist[r.ageBucket] !== undefined) {
      const dayKey = r.ageDays + '天';
      groups[key].ageDist[r.ageBucket][dayKey] = (groups[key].ageDist[r.ageBucket][dayKey] || 0) + r.qty;
    }
    if (!groups[key].productType && r.productType) groups[key].productType = r.productType;
  }
  for (const g of Object.values(groups)) {
    if (g.qty > 0) g.price = g.amount / g.qty;
  }

  let detailGroups = Object.values(groups);

  function getSizeSort(productType) {
    const s = String(productType || '');
    if (viewMode === 'internal') {
      if (s.startsWith('6-')) return 0;
      if (s.startsWith('8-')) return 1;
      if (s.startsWith('12-')) return 2;
      if (s.startsWith('样品')) return 3;
    }
    if (s.includes('D150')) return 0;
    if (s.includes('D200')) return 1;
    if (s.includes('D300')) return 2;
    return 3;
  }

  detailGroups.sort((a, b) => {
    const whOrder = { 'Evershine': 0, 'DSV': 1, 'Femar': 2 };
    if (whOrder[a.wh] !== whOrder[b.wh]) return whOrder[a.wh] - whOrder[b.wh];
    if (a.factory !== b.factory) return a.factory.localeCompare(b.factory);
    const sizeA = getSizeSort(a.productType);
    const sizeB = getSizeSort(b.productType);
    if (sizeA !== sizeB) return sizeA - sizeB;
    if (a.productType !== b.productType) return a.productType.localeCompare(b.productType);
    if (a.customerPN !== b.customerPN) return a.customerPN.localeCompare(b.customerPN);
    return a.internalPN.localeCompare(b.internalPN);
  });

  summaryRows = [];
  const whTotals = {};
  const grandTotal = { qty: 0, amount: 0, inTransit: 0, '1-30days': 0, '31-60days': 0, '61-90days': 0, '91-150days': 0, '151-180days': 0, '>180days': 0 };

  for (const r of detailGroups) {
    if (!whTotals[r.wh]) {
      whTotals[r.wh] = { qty: 0, amount: 0, inTransit: 0, '1-30days': 0, '31-60days': 0, '61-90days': 0, '91-150days': 0, '151-180days': 0, '>180days': 0 };
    }
    whTotals[r.wh].qty += r.qty;
    whTotals[r.wh].amount += r.amount;
    whTotals[r.wh].inTransit += r.inTransit;
    whTotals[r.wh]['1-30days'] += r['1-30days'];
    whTotals[r.wh]['31-60days'] += r['31-60days'];
    whTotals[r.wh]['61-90days'] += r['61-90days'];
    whTotals[r.wh]['91-150days'] += r['91-150days'];
    whTotals[r.wh]['151-180days'] += r['151-180days'];
    whTotals[r.wh]['>180days'] += r['>180days'];

    grandTotal.qty += r.qty;
    grandTotal.amount += r.amount;
    grandTotal.inTransit += r.inTransit;
    grandTotal['1-30days'] += r['1-30days'];
    grandTotal['31-60days'] += r['31-60days'];
    grandTotal['61-90days'] += r['61-90days'];
    grandTotal['91-150days'] += r['91-150days'];
    grandTotal['151-180days'] += r['151-180days'];
    grandTotal['>180days'] += r['>180days'];
  }

  let currentWh = null;
  for (const r of detailGroups) {
    if (r.wh !== currentWh) currentWh = r.wh;
    summaryRows.push({...r, type: 'detail'});
  }

  for (const wh of ['Evershine', 'DSV', 'Femar']) {
    if (whTotals[wh]) {
      summaryRows.push({
        wh: wh + ' 小计', factory: '', customerPN: '', productType: '', internalPN: '', price: '',
        qty: whTotals[wh].qty, amount: whTotals[wh].amount,
        inTransit: whTotals[wh].inTransit,
        '1-30days': whTotals[wh]['1-30days'], '31-60days': whTotals[wh]['31-60days'],
        '61-90days': whTotals[wh]['61-90days'], '91-150days': whTotals[wh]['91-150days'],
        '151-180days': whTotals[wh]['151-180days'],
        '>180days': whTotals[wh]['>180days'],
        type: 'subtotal'
      });
    }
  }

  summaryRows.push({
    wh: '总计', factory: '', customerPN: '', productType: '', internalPN: '', price: '',
    qty: grandTotal.qty, amount: grandTotal.amount,
    inTransit: grandTotal.inTransit,
    '1-30days': grandTotal['1-30days'], '31-60days': grandTotal['31-60days'],
    '61-90days': grandTotal['61-90days'], '91-150days': grandTotal['91-150days'],
    '151-180days': grandTotal['151-180days'],
    '>180days': grandTotal['>180days'],
    type: 'total'
  });
}

function updateFilters() {
  const whSet = new Set();
  const factorySet = new Set();
  for (const r of analyzedData) {
    whSet.add(r.wh);
    factorySet.add(r.factory);
  }
  const whSel = document.getElementById('filterWh');
  whSel.innerHTML = '<option value="">全部</option>';
  for (const w of Array.from(whSet).sort()) {
    whSel.innerHTML += `<option value="${w}">${w}</option>`;
  }
  const facSel = document.getElementById('filterFactory');
  facSel.innerHTML = '<option value="">全部</option>';
  for (const f of Array.from(factorySet).sort()) {
    facSel.innerHTML += `<option value="${f}">${f}</option>`;
  }
}

function isVisible(r) {
  const whFilter = document.getElementById('filterWh').value;
  const facFilter = document.getElementById('filterFactory').value;
  const search = document.getElementById('filterSearch').value.trim().toLowerCase();

  if (whFilter && r.wh !== whFilter) return false;
  if (facFilter && r.factory !== facFilter) return false;
  if (search) {
    const s = (r.customerPN + ' ' + r.internalPN + ' ' + r.productType).toLowerCase();
    if (!s.includes(search)) return false;
  }
  if (r.type === 'detail' && selectedSizes.size > 0 && !selectedSizes.has(r.size)) return false;
  return true;
}

function fmtMoney(v) {
  if (v === '' || v === undefined || v === null) return '';
  return '$' + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function fmtNum(v) {
  if (v === '' || v === undefined || v === null) return '';
  return v.toLocaleString();
}

function toggleInternalPN() {
  showInternalPN = !showInternalPN;

function updateProductType(customerPN, value) {
  if (!value.trim()) return;
  for (const r of summaryRows) {
    if (r.customerPN === customerPN && r.type === 'detail') {
      r.productType = value.trim();
    }
  }
  for (const r of analyzedData) {
    if (r.customerPN === customerPN) {
      r.productType = value.trim();
    }
  }
}

    d30: { color: { argb: 'FF2e7d32' }, bold: true },
    d60: { color: { argb: 'FFf57f17' }, bold: true },
    d90: { color: { argb: 'FFe65100' }, bold: true },
    d150: { color: { argb: 'FFbf360c' }, bold: true },
    d180: { color: { argb: 'FFbf360c' }, bold: true },
    over: { color: { argb: 'FFFFFFFF' }, bold: true },
  };
  const ageKeys = ['inTransit','d30','d60','d90','d150','d180','over'];
  const ageColIndices = ageKeys.map(k => colIndex[k]).filter(v => v !== undefined);

  let rowNum = 2;
  const mergeRanges = [];

  for (const wh of ['Evershine', 'DSV', 'Femar']) {
    const group = [];
    for (const r of summaryRows) {
      if (r.type === 'detail' && r.wh === wh && isVisible(r)) {

      }

    if (group.length === 0) continue;

    const startRow = rowNum;
    for (const r of group) {
      const totalAge = r.inTransit + r['1-30days'] + r['31-60days'] + r['61-90days'] + r['91-150days'] + r['151-180days'] + r['>180days'];
      const row = ws.getRow(rowNum);

      const values = cols.map(c => {
        switch(c.key) {
          case 'wh': return r.wh;
          case 'factory': return r.factory;
          case 'customerPN': return r.customerPN;
          case 'productType': return r.productType;

    }
    const endRow = rowNum - 1;

      mergeRanges.push({ start: startRow, end: endRow });
    }

    const sub = summaryRows.find(r => r.type === 'subtotal' && r.wh === wh + ' 小计');
    if (sub) {
      const totalAge = sub.inTransit + sub['1-30days'] + sub['31-60days'] + sub['61-90days'] + sub['91-150days'] + sub['151-180days'] + sub['>180days'];
      const row = ws.getRow(rowNum);

      const subValues = cols.map(c => {
        if (c.key === 'wh') return sub.wh;
        if (c.key === 'qty') return sub.qty;
        if (c.key === 'amount') return sub.amount;
        if (c.key === 'inTransit') return sub.inTransit;
        if (c.key === 'd30') return sub['1-30days'];
        if (c.key === 'd60') return sub['31-60days'];
        if (c.key === 'd90') return sub['61-90days'];
        if (c.key === 'd150') return sub['91-150days'];
        if (c.key === 'd180') return sub['151-180days'];
        if (c.key === 'over') return sub['>180days'];
        if (c.key === 'total') return totalAge;
        return '';
      });
      row.values = subValues;

      const descColCount = cols.filter(c => ['wh','factory','customerPN','productType','internalPN'].includes(c.key)).length;
      if (descColCount > 1) {
        ws.mergeCells(rowNum, 1, rowNum, descColCount);
      }
      ws.getCell(rowNum, 1).alignment = { horizontal: 'center', vertical: 'middle' };

      const subFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD6DCE4' } };
      const subFont = { color: { argb: 'FF1F4E79' }, bold: true, size: 10 };
      row.eachCell((cell, colNumber) => {
        cell.fill = subFill;
        cell.font = subFont;
        cell.border = { top: { style: 'medium', color: { argb: 'FF1F4E79' } }, 
                        bottom: { style: 'medium', color: { argb: 'FF1F4E79' } },
                        left: thinBorder, right: thinBorder };
        const ageKey = ageKeys.find(k => colIndex[k] === colNumber);
        if (ageKey) {
          cell.fill = ageFills[ageKey];
          cell.font = ageFonts[ageKey];
        }
      });

      if (colIndex.qty) row.getCell(colIndex.qty).numFmt = '#,##0';
      if (colIndex.amount) row.getCell(colIndex.amount).numFmt = '$#,##0.00';
      ageColIndices.forEach(ci => {
        row.getCell(ci).numFmt = '#,##0';
      });
      if (colIndex.total) row.getCell(colIndex.total).numFmt = '#,##0';

      row.height = 22;
      rowNum++;
    }
  }

  const total = summaryRows.find(r => r.type === 'total');
  if (total) {
    const totalAge = total.inTransit + total['1-30days'] + total['31-60days'] + total['61-90days'] + total['91-150days'] + total['151-180days'] + total['>180days'];
    const row = ws.getRow(rowNum);

    const totalValues = cols.map(c => {
      if (c.key === 'wh') return '总计';
      if (c.key === 'qty') return total.qty;
      if (c.key === 'amount') return total.amount;
      if (c.key === 'inTransit') return total.inTransit;
      if (c.key === 'd30') return total['1-30days'];
      if (c.key === 'd60') return total['31-60days'];
      if (c.key === 'd90') return total['61-90days'];
      if (c.key === 'd150') return total['91-150days'];
      if (c.key === 'd180') return total['151-180days'];
      if (c.key === 'over') return total['>180days'];
      if (c.key === 'total') return totalAge;
      return '';
    });
    row.values = totalValues;

    const descColCount = cols.filter(c => ['wh','factory','customerPN','productType','internalPN'].includes(c.key)).length;
    if (descColCount > 1) {
      ws.mergeCells(rowNum, 1, rowNum, descColCount);
    }

    const totalFill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F4E79' } };
    const totalFont = { color: { argb: 'FFFFFFFF' }, bold: true, size: 10 };
    row.eachCell((cell, colNumber) => {
      cell.fill = totalFill;
      cell.font = totalFont;
      cell.border = { top: { style: 'medium', color: { argb: 'FF0f2d47' } },
                      left: thinBorder, right: thinBorder, bottom: thinBorder };
      const ageKey = ageKeys.find(k => colIndex[k] === colNumber);
      if (ageKey) {
        cell.fill = ageFills[ageKey];
        cell.font = ageFonts[ageKey];
      }
    });

    if (colIndex.qty) row.getCell(colIndex.qty).numFmt = '#,##0';
    if (colIndex.amount) row.getCell(colIndex.amount).numFmt = '$#,##0.00';
    ageColIndices.forEach(ci => {
      row.getCell(ci).numFmt = '#,##0';
    });
    if (colIndex.total) row.getCell(colIndex.total).numFmt = '#,##0';

    row.height = 24;
  }

  mergeRanges.forEach(range => {
    ws.mergeCells(range.start, 1, range.end, 1);
    ws.getCell(range.start, 1).alignment = { horizontal: 'center', vertical: 'middle' };
  });

  ws.views = [{ state: 'frozen', ySplit: 1 }];

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `寄售库库存库龄分析_${todayStr}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportPlainExcel() {
  const exportData = [];
  const headers = ['寄售库','ST工厂','客户料号','产品类型'];
  if (showInternalPN) headers.push('内部料号');
  headers.push('单价(26H2)','Amount','Total pcs','在途','1-30days','31-60days','61-90days','91-150days','151-180days','>180days','Total');
  exportData.push(headers);

  for (const r of summaryRows) {
    const totalAge = r.inTransit + r['1-30days'] + r['31-60days'] + r['61-90days'] + r['91-150days'] + r['151-180days'] + r['>180days'];
    const row = [
      r.wh, r.factory, r.customerPN, r.productType,
      ...(showInternalPN ? [r.internalPN] : []),
      r.price, r.amount, r.qty, r.inTransit,
      r['1-30days'], r['31-60days'], r['61-90days'], r['91-150days'], r['151-180days'], r['>180days'],
      totalAge
    ];
    exportData.push(row);
  }

  const ws = XLSX.utils.aoa_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '库存库龄分析');
  XLSX.writeFile(wb, `寄售库库存库龄分析_${todayStr}.xlsx`);
}
